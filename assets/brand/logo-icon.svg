<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Mimperio mark">
<style>
.mi-node{transform-box:fill-box;transform-origin:center;animation:miPulse 3s ease-in-out infinite}
.mi-n2{animation-delay:.3s}.mi-n3{animation-delay:.6s}.mi-n4{animation-delay:.9s}
.mi-n5{animation-delay:1.2s}.mi-n6{animation-delay:1.5s}
.mi-core{transform-box:fill-box;transform-origin:center;animation:miGlow 4s ease-in-out infinite}
@keyframes miPulse{0%,100%{opacity:.85;transform:scale(1)}50%{opacity:1;transform:scale(1.12)}}
@keyframes miGlow{0%,100%{opacity:.9}50%{opacity:1;filter:drop-shadow(0 0 4px #3ea8c8)}}
@media (prefers-reduced-motion:reduce){.mi-node,.mi-core{animation:none}}
</style>
<g class="mi-icon"><line x1="83.1" y1="70.5" x2="76.7" y2="59.4" stroke="#3ea8c8" stroke-width="9" stroke-linecap="round"/><line x1="119.2" y1="72.0" x2="122.3" y2="67.6" stroke="#3ea8c8" stroke-width="9" stroke-linecap="round"/><line x1="66.1" y1="102.7" x2="53.4" y2="103.8" stroke="#3ea8c8" stroke-width="9" stroke-linecap="round"/><line x1="80.4" y1="127.8" x2="74.4" y2="136.3" stroke="#3ea8c8" stroke-width="9" stroke-linecap="round"/><line x1="111.6" y1="132.0" x2="115.3" y2="142.3" stroke="#3ea8c8" stroke-width="9" stroke-linecap="round"/><line x1="129.5" y1="116.9" x2="137.5" y2="121.5" stroke="#3ea8c8" stroke-width="9" stroke-linecap="round"/><g class="mi-core"><circle cx="100" cy="100" r="30" fill="none" stroke="#3ea8c8" stroke-width="10"/><circle cx="100" cy="100" r="14" fill="none" stroke="#3ea8c8" stroke-width="9"/></g><circle class="mi-node mi-n1" cx="69" cy="46" r="12" fill="none" stroke="#3ea8c8" stroke-width="7"/><circle class="mi-node mi-n2" cx="135" cy="49" r="18" fill="none" stroke="#3ea8c8" stroke-width="9"/><circle class="mi-node mi-n3" cx="38" cy="105" r="12" fill="none" stroke="#3ea8c8" stroke-width="7"/><circle class="mi-node mi-n4" cx="64" cy="151" r="14" fill="none" stroke="#3ea8c8" stroke-width="8"/><circle class="mi-node mi-n5" cx="121" cy="158" r="13" fill="none" stroke="#3ea8c8" stroke-width="7.5"/><circle class="mi-node mi-n6" cx="154" cy="131" r="15" fill="none" stroke="#3ea8c8" stroke-width="8"/></g>
</svg>